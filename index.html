<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screener Desk</title>
<style>
  /*
    Design concept: "private-office research note."

    Light = bone paper and ink: a warm off-white stock rather than the earlier sage
    green (which read folksy rather than institutional), near-black text with a single
    restrained brass accent. Dark = a lamp-lit desk after hours: warm charcoal, not the
    blue-black of a terminal, with champagne rather than amber so it reads as material
    (metal, paper) rather than as a screen effect.

    The luxury cues here are deliberately NOT ornament -- no gradients on chrome, no
    heavy shadows, no gold fills. They are: restraint in colour (hue appears only on
    numbers that carry meaning, never on structure), hairline rules instead of borders,
    generous and consistent spacing, and typography that gets LIGHTER as it gets larger
    -- a heavy 52px figure reads as shouting, a light one as confidence.
  */
  :root {
    --bg: #f4f2ed;
    --surface: #fffefb;
    --surface-2: #efece5;
    --border: #ddd8cd;
    --hairline: #e8e4da;
    --text: #1a1a18;
    --text-dim: #78736a;
    --accent: #8a6a2f;
    --accent-soft: #efe7d6;
    --good: #2c6446;
    --good-soft: #e2ece4;
    --bad: #97372c;
    --bad-soft: #f2e0dc;
    --warn: #8a6a2f;
    --warn-soft: #efe7d6;
    --radius: 3px;
    --glow: none;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
    --bg: #14130f;
    --surface: #1c1b17;
    --surface-2: #232219;
    --border: #33312a;
    --hairline: #2a2823;
    --text: #efece4;
    --text-dim: #948d80;
    --accent: #c8a86a;
    --accent-soft: #2b2418;
    --good: #6fb98c;
    --good-soft: #17271d;
    --bad: #d97a6a;
    --bad-soft: #2e1a16;
    --warn: #c8a86a;
    --warn-soft: #2b2418;
      --glow: 1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14130f;
    --surface: #1c1b17;
    --surface-2: #232219;
    --border: #33312a;
    --hairline: #2a2823;
    --text: #efece4;
    --text-dim: #948d80;
    --accent: #c8a86a;
    --accent-soft: #2b2418;
    --good: #6fb98c;
    --good-soft: #17271d;
    --bad: #d97a6a;
    --bad-soft: #2e1a16;
    --warn: #c8a86a;
    --warn-soft: #2b2418;
      --glow: 1;
  }
  :root[data-theme="light"] {
    --bg: #f4f2ed;
    --surface: #fffefb;
    --surface-2: #efece5;
    --border: #ddd8cd;
    --hairline: #e8e4da;
    --text: #1a1a18;
    --text-dim: #78736a;
    --accent: #8a6a2f;
    --accent-soft: #efe7d6;
    --good: #2c6446;
    --good-soft: #e2ece4;
    --bad: #97372c;
    --bad-soft: #f2e0dc;
    --warn: #8a6a2f;
    --warn-soft: #efe7d6;
    --glow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 32px 20px 60px; }

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 400;
    letter-spacing: -0.012em;
    margin: 0;
    text-wrap: balance;
  }
  .masthead h1::before { content: "▲ "; color: var(--accent); font-family: var(--sans); }
  .masthead .subtitle { font-family: var(--sans); font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .masthead .meta { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }

  /* HERO -- the three figures that answer "how is the book doing right now".
     Deliberately larger and wider than everything else so the eye lands here first. */
  .hero-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 640px) { .hero-row { grid-template-columns: 1fr; } }
  /* No coloured top-bar: a 3px slab of green on every card is the loudest thing on
     the page and says nothing the number itself doesn't. A hairline frame plus a short
     accent rule above the label does the same job quietly. */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 22px 24px 20px;
    position: relative;
  }
  .hero-card::before {
    content: ""; position: absolute; top: 0; left: 24px; width: 26px; height: 2px;
    background: var(--border);
  }
  .hero-card.good::before { background: var(--good); }
  .hero-card.bad::before { background: var(--bad); }
  .hero-card .label {
    font-family: var(--sans); font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim);
  }
  .hero-card .value { font-family: var(--mono); font-size: 38px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .hero-card:first-child .value { font-size: 54px; }
  /* No neon glow behind the figures in dark mode. It was tuned to an older, more
     saturated palette and it reads as a gaming HUD; a number this size does not need
     to be lit from behind to be found. */
  .hero-card .value.good { color: var(--good); }
  .hero-card .value.bad { color: var(--bad); }
  .hero-card .sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 10px; letter-spacing: 0.01em; }

  /* MARKET STRIP -- context, not headline. One thin row instead of four full cards. */
  .market-strip {
    display: flex; flex-wrap: wrap; gap: 0;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
    margin-bottom: 34px; overflow: hidden;
  }
  .market-item { flex: 1 1 108px; padding: 12px 16px; border-right: 1px solid var(--hairline); }
  .market-item:last-child { border-right: none; }
  .market-item .m-label {
    font-family: var(--sans); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .market-item .m-value { font-family: var(--mono); font-size: 16px; font-weight: 400; letter-spacing: -0.01em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .market-item .m-value.good { color: var(--good); }
  .market-item .m-value.bad { color: var(--bad); }
  .market-item .m-sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
  .market-item.is-book { background: var(--accent-soft); }

  /* NEWS SENTIMENT (2026-08-06, user request): the 0-100 daily market-mood score comes
     from a separate Cowork news-digest system (BriefData/bullbear-log.json). Until now
     it lived only in Discord, so "how did the book do" and "what was the news mood"
     were never on the same page. Same visual family as .market-strip deliberately --
     it is context for the book, not a headline number, so it must not outshout the
     hero row. The whole strip is hidden when the file is missing or unparseable. */
  .sentiment-strip {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
    padding: 12px 16px; margin: -22px 0 34px;
  }
  .sentiment-strip .s-head { min-width: 132px; }
  .sentiment-strip .s-label {
    font-family: var(--sans); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .sentiment-strip .s-value {
    font-family: var(--mono); font-size: 16px; margin-top: 4px; font-variant-numeric: tabular-nums;
  }
  .sentiment-strip .s-value.good { color: var(--good); }
  .sentiment-strip .s-value.bad { color: var(--bad); }
  .sentiment-strip .s-value.neutral { color: var(--text-dim); }
  /* CAPPED WIDTH (2026-08-06): this was `flex: 1 1 220px` with no maximum, so on a
     1140px page the sparkline stretched to ~900px against a 34px height -- a 26:1 box in
     which a real 20-to-88 swing rendered as a nearly flat line. The chart was drawing
     the right numbers and showing nothing. A sparkline needs a readable aspect ratio,
     not all the space available; `margin-right: auto` keeps it left-aligned rather than
     letting flex stretch the gap. */
  .sentiment-strip .s-spark { flex: 0 1 340px; min-width: 180px; max-width: 340px; margin-right: auto; }
  .sentiment-strip .s-spark svg { display: block; width: 100%; height: 40px; overflow: visible; }
  .sentiment-strip .s-foot {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 3px;
    display: flex; justify-content: space-between;
  }
  @media (max-width: 640px) { .sentiment-strip { margin-top: -14px; } }

  /* RISK RAIL -- where price sits between its stop and its first target. Replaces the
     four numeric columns (Tier/TP1/TP2/SL) that were pushed off-screen by an 11-column
     table; the relationship is what matters and a bar shows it at a glance. */
  .rail { min-width: 118px; }
  .rail-track {
    position: relative; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--bad-soft), var(--border) 45%, var(--good-soft));
  }
  .rail-dot {
    position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
    transform: translate(-50%, -50%); border: 2px solid var(--surface);
  }
  .rail-dot.good { background: var(--good); }
  .rail-dot.bad { background: var(--bad); }
  .rail-ends {
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-top: 3px;
  }

  /* HISTORY -- collapsed by default. Every position used to render its full event
     chain inline, which doubled the row count and still got clipped at the right edge. */
  .history-toggle {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    cursor: pointer; list-style: none; padding: 2px 0;
  }
  .history-toggle::-webkit-details-marker { display: none; }
  .history-toggle::before { content: "▸ "; color: var(--accent); }
  details[open] > .history-toggle::before { content: "▾ "; }
  .history-toggle:hover { color: var(--text); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 30px; }
  /* Same treatment as the hero cards -- hairline frame, short accent rule -- so the two
     bands read as one family instead of two different card designs on one page. */
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    position: relative;
  }
  .stat-card::before {
    content: ""; position: absolute; top: 0; left: 16px; width: 20px; height: 2px;
    background: var(--border);
  }
  .stat-card.good::before { background: var(--good); }
  .stat-card.bad::before { background: var(--bad); }
  .stat-card .label {
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .stat-card .value {
    font-family: var(--mono);
    font-size: 23px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .stat-card .value.good { color: var(--good); }
  .stat-card .value.bad { color: var(--bad); }
  .stat-card .sub { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 5px; }

  section { margin-bottom: 32px; }
  /* Section rules are a single hairline, not the double rule they were. A heading only
     has to say "new section"; at 6 sections a page, a heavy rule each time is 6 loud
     horizontal bars competing with the numbers. */
  section > h2 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--text);
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 11px; text-align: left; white-space: nowrap; vertical-align: middle; }
  /* Screener column can hold 2+ chips (a symbol with concurrent positions can pass
     multiple templates) -- let it wrap instead of forcing the whole table wider. */
  tbody tr td:last-child { white-space: normal; }
  th {
    font-family: var(--sans);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-dim);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  tbody tr + tr td { border-top: 1px solid var(--border); }
  /* Greenbar ledger stripe, one row per position (2026-08-05: was 4n+1/4n+2 back when
     each position rendered as a data row PLUS a history row; with history collapsed
     inline that striped two and skipped two).
     One warm translucent wash rather than a per-theme solid: at this alpha it darkens
     paper and lifts charcoal, so both themes get the same barely-there stripe from one
     value, and it can never drift out of sync with the two palettes. */
  tbody tr:nth-child(odd) td { background: rgba(128, 120, 100, 0.055); }
  td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }

  /* NARROW SCREENS (2026-08-05): this dashboard is opened mostly from the Discord link,
     i.e. on a phone, where a 6-column 753px table means horizontal scrolling to read a
     single position. Below 640px each row becomes a stacked card with its values
     labelled, so everything is readable in one vertical scroll. The table markup is
     unchanged -- only its display is. */
  @media (max-width: 640px) {
    .table-scroll { border: none; background: transparent; overflow-x: visible; }
    #positions-target table, #positions-target tbody, #positions-target tr, #positions-target td { display: block; width: 100%; }
    #positions-target thead { display: none; }
    #positions-target tbody tr {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; padding: 4px 2px;
    }
    #positions-target tbody tr:nth-child(odd) td { background: transparent; }
    #positions-target tbody tr + tr td { border-top: none; }
    #positions-target td { white-space: normal; border: none; padding: 5px 12px; text-align: left; }
    #positions-target td.num { text-align: left; }
    /* label each value, except the symbol which is the card's own heading */
    #positions-target td[data-label]:not([data-label=""])::before {
      content: attr(data-label);
      display: block;
      font-family: var(--sans); font-size: 9.5px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 1px;
    }
    #positions-target td.symbol { font-size: 16px; padding-top: 10px; }
    /* On mobile every row is a bordered card, so a tier row inherited that card chrome
       and rendered as an empty white box with a word in it. It is a divider, not an
       entry: strip the card and let it sit as a bare label between groups. */
    #positions-target tbody tr.tier-row {
      background: transparent; border: none; margin-bottom: 0; padding: 0;
    }
    #positions-target tr.tier-row td {
      background: transparent !important; border-top: none !important;
      padding: 20px 2px 6px;
    }
    #positions-target tbody tr.tier-row:first-child td { padding-top: 4px; }
    #positions-target tbody tr.screener-row {
      background: transparent; border: none; margin-bottom: 0; padding: 0;
    }
    #positions-target tr.screener-row td {
      background: transparent !important; border-top: none !important;
      padding: 12px 2px 4px 14px;
    }
    .rail { min-width: 0; }
  }
  td.symbol { font-family: var(--mono); font-weight: 700; }

  /* Outlined, not filled. A filled capsule per row put ~50 solid colour blocks down the
     left of the table; the state is a label, not a status light. Colour survives in the
     text and the hairline, which is enough to scan by. */
  .pill {
    display: inline-block;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 3px 8px 2px;
    border-radius: 2px;
    border: 1px solid currentColor;
    letter-spacing: 0.1em;
  }
  .pill.entered { color: var(--good); }
  .pill.tp1_taken { color: var(--good); background: var(--good-soft); }
  .pill.waiting_correction { color: var(--warn); }
  .pill.flat { color: var(--text-dim); }

  /* TIER SECTION DIVIDER (2026-07-17, user request): a slim labeled rule between
     each position tier (Holding/TP Taken/Trailing Stop Raised/At Original
     Stop/Waiting Correction/Closed) so the grouping reads as distinct sections. */
  tbody tr.tier-row td {
    background: var(--surface) !important;
    font-family: var(--sans);
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    padding: 16px 12px 7px;
    border-top: 1px solid var(--border) !important;
  }
  tbody tr.tier-row:first-child td { padding-top: 9px; border-top: none !important; }

  /* SCREENER SUB-DIVIDER (2026-08-23, user request; made bolder 2026-08-26 --
     "อ่านง่ายและเด่นชัดกว่านี้" -- the first version at 9.5px/text-dim/weight 500 read
     as barely different from a data row when scanning). Nested INSIDE the
     Holding/Waiting tiers, one per batch of same-screener positions. Still one step
     down from .tier-row -- no top rule, tighter lead-in, smaller letter-spacing --
     so tier reads as the section and screener as a grouping within it, but now in
     --accent (the project's existing signpost colour, see .pill/.hero-card) and
     sans-serif (it holds a readable name now, not a template_id) so it actually
     draws the eye instead of blending into the mono data rows below it. */
  tbody tr.screener-row td {
    background: var(--surface) !important;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    padding: 12px 12px 6px 20px;
    border-top: none !important;
  }

  .history-row td { padding: 4px 12px 12px; border-top: none !important; }
  .history-track { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; white-space: normal; }
  .history-step { display: inline-flex; align-items: baseline; gap: 5px; }
  .history-kind {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .history-kind.entry { background: var(--good-soft); color: var(--good); }
  .history-kind.tp1, .history-kind.tp2_close { background: var(--good-soft); color: var(--good); }
  .history-kind.stop, .history-kind.waiting_correction_invalidated { background: var(--bad-soft); color: var(--bad); }
  .history-kind.waiting_correction_start { background: var(--warn-soft); color: var(--warn); }
  .history-kind.trailing_stop_raised, .history-kind.tier_assigned { background: var(--accent-soft); color: var(--accent); }
  .history-meta { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .history-arrow { color: var(--text-dim); font-size: 11px; margin: 0 2px; }
  .history-empty { font-family: var(--mono); font-size: 11px; color: var(--text-dim); font-style: italic; }

  .pct.good { color: var(--good); }
  .pct.bad { color: var(--bad); }

  .empty-state {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .bar-row .bar-label { width: 150px; font-family: var(--mono); font-size: 12px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 7px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }
  .bar-fill.strategy { background: var(--accent); }
  .bar-fill.benchmark { background: var(--text-dim); }
  .bar-row .bar-value { width: 70px; text-align: right; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

  .screener-group { padding: 10px 0; }
  .screener-group + .screener-group { border-top: 1px solid var(--border); }
  .screener-group .bar-row { padding-bottom: 8px; }
  .ticker-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 160px; }
  /* Matches .pill: squared hairline tag, not a filled capsule. These two sit in adjacent
     columns of the same row, so two different chip shapes read as two unrelated systems. */
  .ticker-chip {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    padding: 3px 8px 2px;
    border-radius: 2px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    border: 1px solid var(--border);
  }

  .alert-log { display: flex; flex-direction: column; }
  .alert-row {
    display: grid;
    grid-template-columns: 92px 72px 130px 1fr;
    gap: 12px;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    align-items: baseline;
  }
  .alert-row:first-child { border-top: none; }
  /* Striping is a JS-assigned .alt class (2026-08-26), not :nth-child(even) -- the
     screener-group-header divs interspersed below are siblings too, and nth-child
     counts them, which would throw the alternation off by however many headers
     precede a given row. */
  .alert-row.alt { background: var(--surface-2); }
  .alert-row .ts { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

function escapeHtml(s) {
  const str = s === null || s === undefined ? "" : String(s);
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function fmtPrice(x) {
  if (x === null || x === undefined) return "—";
  return "$" + x.toFixed(2);
}

function riskRail(p) {
  const sl = p.sl_price, now = p.current_price;
  if (sl == null || now == null) return `<span class="history-empty">&mdash;</span>`;

  // NEXT UNMET TARGET, not always TP1 (bug fix on first draft): once a position is
  // TP1_TAKEN its TP1 is history, and the trailing stop has usually been raised ABOVE
  // that old level. Anchoring the rail to TP1 then produced an inverted range --
  // CDNA #180 rendered SL 35.11 "to" TP1 33.19 and clamped the marker to the far left,
  // reading as "about to stop out" on a position up +115%. Strictly worse than no bar.
  const takenTp1 = p.state === "TP1_TAKEN";
  let target = takenTp1 ? p.tp2_price : p.tp1_price;
  let targetName = takenTp1 ? "TP2" : "TP1";
  if (target == null || target <= sl) {          // tier 3 has no TP2; or a stop raised past the target
    target = null;
  }
  const top = target != null ? target : Math.max(now, sl * 1.02);
  const span = top - sl;
  const raw = span > 0 ? (now - sl) / span : 1;
  const pos = Math.max(0, Math.min(1, raw));
  const cls = p.unrealized_pct != null && p.unrealized_pct < 0 ? "bad" : "good";
  const rightLabel = target != null ? fmtPrice(target) : "no target";
  const title = `SL ${fmtPrice(sl)} · now ${fmtPrice(now)}`
    + (target != null ? ` · ${targetName} ${fmtPrice(target)}` : ` · ${targetName} n/a`)
    + (p.poc_tier ? ` · tier ${p.poc_tier}` : "")
    + (raw > 1 ? " · already past target" : "");
  return `
      <div class="rail" title="${escapeHtml(title)}">
        <div class="rail-track"><span class="rail-dot ${cls}" style="left:${(pos * 100).toFixed(1)}%"></span></div>
        <div class="rail-ends"><span>${fmtPrice(sl)}</span><span>${escapeHtml(rightLabel)}</span></div>

  // because the fix was applied per-surface instead of to a shared definition.
  // `is_held` is now computed in Python from signals/state_machine.py's HELD_STATES, so
  // this file no longer gets a vote on what "held" means.
  const heldPositions = data.open_positions.filter(p => p.is_held);
  const waitingCount = data.open_positions.length - heldPositions.length;
  const symCount = new Set(heldPositions.map(p => p.symbol)).size;
  heroCards.push({
    label: "Open Positions",
    value: heldPositions.length,
    cls: "",
    // The old card printed all 33 tickers here as one unbroken block of text -- an
    // unreadable wall that also made this card three times taller than its neighbours.
    sub: heldPositions.length
      ? symCount + " symbols" + (waitingCount ? " · " + waitingCount + " waiting" : "")
        + " · " + data.screener.total_symbols + " in today's screen"
      : "none right now",
  });
  document.getElementById("hero-row").innerHTML = heroCards.map(c => `
    <div class="hero-card ${c.cls}">
      <div class="label">${escapeHtml(c.label)}</div>
      <div class="value ${c.cls}">${escapeHtml(c.value)}</div>
      <div class="sub">${escapeHtml(c.sub || "")}</div>
    </div>
  `).join("");

  // Market strip: the book's own 1D move sits FIRST and tinted, so "did I beat the
  // tape today" is one left-to-right read rather than a hunt across four cards.
  const marketItems = [];
  if (perf && perf.port_day_change_pct != null) {
    marketItems.push({
      label: "My Book 1D", value: fmtPct(perf.port_day_change_pct),
      cls: pctClass(perf.port_day_change_pct), sub: "avg across open", book: true,
    });
  }
  const indexLabels = { DJI: "Dow Jones", SPX: "S&P 500", NDX: "Nasdaq-100", RUSSELL: "Russell 2000" };
  (data.market_indices || []).forEach(idx => {
    marketItems.push({
      label: indexLabels[idx.label] || idx.label,
      value: fmtPct(idx.day_change_pct),
      cls: pctClass(idx.day_change_pct),
      sub: idx.current_price != null ? idx.current_price.toLocaleString(undefined, {maximumFractionDigits: 2}) : "—",
    });
  });
  document.getElementById("market-strip").innerHTML = marketItems.map(m => `
    <div class="market-item ${m.book ? "is-book" : ""}">
      <div class="m-label">${escapeHtml(m.label)}</div>
      <div class="m-value ${m.cls}">${escapeHtml(m.value)}</div>
      <div class="m-sub">${escapeHtml(m.sub || "")}</div>
    </div>
  `).join("");

  // NEWS SENTIMENT strip (2026-08-06). data.news_sentiment is null whenever the
  // BriefData file is missing/unreadable -- that is a normal state (it belongs to a
  // different system), so the strip stays display:none rather than rendering an empty
  // shell or an error. Everything below is defensive for the same reason.
  (function renderSentiment() {
    const el = document.getElementById("sentiment-strip");
    if (!el) return;
    const ns = data.news_sentiment;
    if (!ns || !ns.latest || !Array.isArray(ns.series) || ns.series.length === 0) return;

    const score = ns.latest.score;
    const cls = score >= 60 ? "good" : (score <= 40 ? "bad" : "neutral");
    const pts = ns.series.filter(p => p && typeof p.score === "number");
    if (!pts.length) return;

    // Sparkline on a fixed 0-100 domain so the shape is comparable day to day
    // (auto-scaling to min/max would make a flat neutral week look dramatic).
    const W = 100, H = 30, PAD = 2;
    const stepX = pts.length > 1 ? (W - PAD * 2) / (pts.length - 1) : 0;
    const xy = pts.map((p, i) => [
      PAD + i * stepX,
      PAD + (H - PAD * 2) * (1 - Math.max(0, Math.min(100, p.score)) / 100),
    ]);
    const path = xy.map((c, i) => (i ? "L" : "M") + c[0].toFixed(2) + " " + c[1].toFixed(2)).join(" ");
    const midY = (PAD + (H - PAD * 2) * 0.5).toFixed(2);
    const last = xy[xy.length - 1];
    const stroke = cls === "good" ? "var(--good)" : (cls === "bad" ? "var(--bad)" : "var(--text-dim)");
    const first = pts[0], lastPt = pts[pts.length - 1];

    el.innerHTML =
      '<div class="s-head">' +
        '<div class="s-label">News Sentiment</div>' +
        '<div class="s-value ' + cls + '">' + score + '/100 · ' + escapeHtml(ns.latest.label) + '</div>' +
      '</div>' +
      '<div class="s-spark">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
             'aria-label="News sentiment, last ' + pts.length + ' days, latest ' + score + ' out of 100">' +
          '<line x1="' + PAD + '" y1="' + midY + '" x2="' + (W - PAD) + '" y2="' + midY + '" ' +
                'stroke="var(--hairline)" stroke-width="0.6" stroke-dasharray="2 2" />' +
          '<path d="' + path + '" fill="none" stroke="' + stroke + '" stroke-width="1.4" ' +
                'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />' +
          '<circle cx="' + last[0].toFixed(2) + '" cy="' + last[1].toFixed(2) + '" r="1.8" fill="' + stroke + '" />' +
        '</svg>' +
        '<div class="s-foot">' +
          '<span>' + escapeHtml(first.date) + '</span>' +
          '<span>50 = neutral · ' + pts.length + 'd</span>' +
          '<span>' + escapeHtml(lastPt.date) + '</span>' +
        '</div>' +
      '</div>';
    el.style.display = "flex";
  })();

  const stats = [];
  if (data.last_backtest && data.last_backtest.limited) {
    const limited = data.last_backtest.limited;
    const unlimited = data.last_backtest.unlimited;
    stats.push({
      label: "Last Backtest Return (limited capital)",
      value: fmtPct(limited.blended_return),
      valueClass: pctClass(limited.blended_return),
      sub: limited.universe_size + " symbols, " + data.last_backtest.run_date,
    });
    if (limited.win_rate != null) {
      stats.push({
        label: "Win Rate",
        value: fmtPct(limited.win_rate, 1),
        sub: "avg win " + fmtPct(limited.avg_win) + " · avg loss " + fmtPct(limited.avg_loss),
      });
    }
    const bench = data.last_backtest.benchmark_returns || {};
    const beatsAll = Object.values(bench).every(b => limited.blended_return > b);
    stats.push({
      label: "vs. Benchmarks (limited)",
      value: beatsAll ? "Beats all 3" : "Mixed",
      valueClass: beatsAll ? "good" : "",
      sub: Object.entries(bench).map(([k, v]) => k + " " + fmtPct(v, 0)).join(" · "),
    });
    if (unlimited) {
      stats.push({
        label: "Backtest (unlimited capital)",
        value: fmtPct(unlimited.blended_return),
        valueClass: pctClass(unlimited.blended_return),
        sub: "same universe, fixed $ per entry",
      });
    }
  }
  stats.push({
    label: "Screener Universe",
    value: data.screener.total_symbols,
    sub: data.screener.run_date ? "as of " + data.screener.run_date : "no data yet",
  });

  // RISK RAIL -- one cell replacing the Tier/TP1/TP2/SL columns that an 11-column
  // table pushed off-screen. Shows where `now` sits between the stop and the first
  // target, which is the relationship those four numbers existed to convey. Exact
  // prices stay available on hover rather than being dropped.
  // Screener template names run to 31 characters ("full_version_minervini_screener")
  // and a symbol can pass several at once -- rendering them in full is what pushed the
  // final column off the right edge. Fixed map rather than generated initials: several
  // pairs collide (tehcnial_jinna / turnaround_jinna, super_stock_jinna /
  // sniper_shot_jinna), and a chip that silently means two different screeners is worse
  // than a long one. Full name stays on hover.
  //
  // READ FROM data.screener_abbr, not hardcoded here (2026-08-23) -- this used to be
  // its own copy of the same map screeners/definitions.py defines in Python for the
  // Discord digest, kept in sync only by hand. One definition now; this just renders it.
  const SCREENER_ABBR = data.screener_abbr || {};
  // Raw state enums are what the DB stores, but "WAITING_CORRECTION" is 18 characters
  // and sized the whole State column -- wider than Symbol, and enough on its own to push
  // History off the right edge. Display labels only; the enum is unchanged everywhere else.
  const STATE_LABEL = { ENTERED: "ENTERED", TP1_TAKEN: "TP1 TAKEN", WAITING_CORRECTION: "WAITING" };
  function stateLabel(s) { return STATE_LABEL[s] || s; }

  function screenerChips(list) {
    if (!list || !list.length) return `<span class="history-empty">not in today's screen</span>`;
    return list.map(name => {
      const short = SCREENER_ABBR[name] || name;
      return `<span class="ticker-chip" title="${escapeHtml(name)}">${escapeHtml(short)}</span>`;
    }).join(" ");
  }

  // riskRail() is now injected from reports/dashboard_functions.js -- see the
  // injection marker near the top of this script block.

  // HISTORY -- collapsed. Rendering every event inline doubled the row count and still
  // clipped at the right edge; the summary carries what a glance needs (how many events,
  // and what the last one was) with the full chain one click away.
  function historyCell(p) {
    const h = p.history || [];
    if (!h.length) return `<span class="history-empty">no events yet</span>`;
    const last = h[h.length - 1];
    const steps = h.map(e => `
      <span class="history-step">
        <span class="history-kind ${e.kind.toLowerCase()}">${escapeHtml(e.kind)}</span>
        <span class="history-meta">${escapeHtml((e.ts || "").slice(0, 10))}${e.price != null ? " @ " + fmtPrice(e.price) : ""}</span>
      </span>`).join(`<span class="history-arrow">&rarr;</span>`);
    // Short kind labels: the full name ("TRAILING_STOP_RAISED") in a collapsed summary
    // is ~20 chars of the widest column and is what kept pushing this column off-screen.
    // The full chain, uncut, is one click away.
    const SHORT = {
      ENTRY: "entry", TIER_ASSIGNED: "tier", TRAILING_STOP_RAISED: "TS↑", TP1: "TP1",
      TP2_CLOSE: "TP2", STOP: "stop", WAITING_CORRECTION_START: "wait",
      WAITING_CORRECTION_RECONFIRMED: "wait↻", WAITING_CORRECTION_INVALIDATED: "wait✕",
      ENTRY_BLOCKED_UNTRADEABLE: "blocked", CLOSED_POSITION_CAP: "capped",
    };
    const shortKind = SHORT[last.kind] || last.kind.toLowerCase();
    return `
      <details>
        <summary class="history-toggle">${h.length}ev · ${escapeHtml(shortKind)} ${escapeHtml((last.ts || "").slice(5, 10))}</summary>
        <div class="history-track">${steps}</div>
      </details>`;
  }

  // --- Open + closed positions, grouped by tier ---
  // TIER ORDER (2026-07-18, user request: "เอา wait correction position มาอยู่ก่อน
  // closed position") -- 3 buckets (see db/database.py's classify_position_tier()):
  // 0 = any actually-held position (sorted by screener then alphabetically, no
  // TP/TS/SL sub-split), 1 = waiting correction, 2 = closed. data.open_positions
  // only carries tiers 0 and 1 (both already sorted correctly relative to each
  // other from reports/dashboard.py); tier 2 (closed) is a SEPARATE list, so
  // concatenating naively would put every closed row after ALL of open_positions,
  // including its tier-1 rows -- a stable sort by `.tier` after concatenating
  // interleaves them into the correct 0,1,2 order.
  const TIER_SECTION_LABEL = {
    position: "Holding",
    closed: "Closed",
    wait_correction: "Waiting Correction",
  };
  const posTarget = document.getElementById("positions-target");
  const allPositions = [...data.open_positions, ...(data.closed_positions || [])]
    .sort((a, b) => a.tier - b.tier);
  if (!allPositions.length) {
    posTarget.innerHTML = `<div class="empty-state">No positions tracked yet.</div>`;
  } else {
    let lastTier = null;
    // SCREENER SUB-GROUPS (2026-08-23, user request): "เขียนเพิ่มก่อนชื่อหุ้นในแต่ละ
    // ชุด screener ว่าหุ้นชุดไหนมาจาก screener ตัวไหน" -- one label per batch of
    // same-screener rows, nested inside the existing tier divider. p.screener_group
    // is computed in Python (reports/dashboard.py, via screener_group_label()) from
    // the SAME ranking the rows are already sorted by, so this only has to detect
    // where the label CHANGES, never decide what it says.
    let lastScreenerGroup = null;
    const rows = allPositions.map(p => {
      const isClosed = p.tier_label === "closed";
      let sectionRow = "";
      if (p.tier !== lastTier) {
        lastTier = p.tier;
        lastScreenerGroup = null;  // a new tier always gets its own fresh sub-header
        sectionRow = `<tr class="tier-row"><td colspan="6">${escapeHtml(TIER_SECTION_LABEL[p.tier_label] || p.tier_label)}</td></tr>`;
      }
      // Closed positions sort by exit date, not by screener (see reports/dashboard.py),
      // so a screener label there would jump around with no relationship to the rows
      // under it -- only Holding (tier 0) and Waiting (tier 1) are actually grouped
      // this way.
      if (!isClosed && p.screener_group !== lastScreenerGroup) {
        lastScreenerGroup = p.screener_group;
        sectionRow += `<tr class="screener-row"><td colspan="6">${escapeHtml(p.screener_group || "")}</td></tr>`;
      }
      if (isClosed) {
        const emoji = p.exit_kind === "TP2_CLOSE" ? "🎯" : "🛑";
        const label = p.exit_kind === "TP2_CLOSE" ? "Closed (TP2)" : "Closed (SL)";
        return `
          ${sectionRow}
          <tr>
            <td class="symbol">${escapeHtml(p.symbol)}${p.position_id != null ? ` <span class="history-meta">#${p.position_id}</span>` : ""}</td>
            <td><span class="pill flat">${emoji} ${escapeHtml(label)}</span></td>
            <td class="num">${fmtPrice(p.entry_price)} <span class="history-meta">&rarr;</span> ${fmtPrice(p.exit_price)}</td>
            <td class="num pct ${pctClass(p.realized_pct)}">${fmtPct(p.realized_pct)}</td>
            <td><span class="history-empty">&mdash;</span></td>
            <td><span class="history-meta">exited ${escapeHtml((p.exit_date || "").slice(0, 10))}</span></td>
          </tr>
        `;
      }
      const stateClass = p.state.toLowerCase();
      return `
        ${sectionRow}
        <tr>
          <td class="symbol" data-label="">${escapeHtml(p.symbol)}${p.position_id != null ? ` <span class="history-meta">#${p.position_id}</span>` : ""}</td>
          <td data-label="State"><span class="pill ${stateClass}" title="${escapeHtml(p.state)}">${escapeHtml(stateLabel(p.state))}</span></td>
          <td class="num" data-label="Entry → Now">${fmtPrice(p.entry_price)} <span class="history-meta">&rarr;</span> ${fmtPrice(p.current_price)}</td>
          <td class="num pct ${pctClass(p.unrealized_pct)}" data-label="P&L">${fmtPct(p.unrealized_pct)}<br>
              <span class="history-meta">1D ${fmtPct(p.day_change_pct)}</span></td>
          <td data-label="SL → target">${riskRail(p)}</td>
          <td data-label="History">${historyCell(p)}<br>${screenerChips(p.screener_templates)}</td>
        </tr>
      `;
    }).join("");
    posTarget.innerHTML = `
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Symbol</th><th>State</th>
              <th class="num">Entry &rarr; Now</th><th class="num">P&amp;L</th>
              <th>SL &mdash; next target</th>
              <th>History &amp; Screener</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  // --- Screener universe ---
  const screenerTarget = document.getElementById("screener-target");
  if (!data.screener.run_date) {
    screenerTarget.innerHTML = `<div class="empty-state">No screener runs recorded yet.</div>`;
  } else {
    const maxCount = Math.max(...data.screener.by_template.map(t => t.count), 1);
    const groups = data.screener.by_template.map(t => {
      const chips = (t.symbols || []).map(s => `<span class="ticker-chip">${escapeHtml(s)}</span>`).join("");
      return `
      <div class="screener-group">
        <div class="bar-row">
          <div class="bar-label">${escapeHtml(t.template)}</div>
          <div class="bar-track"><div class="bar-fill strategy" style="width:${(t.count / maxCount * 100).toFixed(0)}%"></div></div>
          <div class="bar-value">${t.count}</div>
        </div>
        <div class="ticker-chips">${chips}</div>
      </div>
    `;
    }).join("");
    screenerTarget.innerHTML = `<div class="table-scroll" style="padding:14px 16px;">${groups}</div>`;
  }

  // --- Last backtest --- (PYRAMIDING, 2026-07-15: BOTH capital modes shown, one
  // section each, sharing the benchmark bars -- see backtest/run_backtest.py's
  // CAPITAL MODES docstring for why both are reported rather than picking one)
  const backtestTarget = document.getElementById("backtest-target");
  const btData = data.last_backtest;
  if (!btData || !btData.limited) {
    document.getElementById("backtest-section").style.display = "none";
  } else {
    const benchBars = Object.entries(btData.benchmark_returns || {}).map(([name, ret]) => `
      <div class="bar-row">
        <div class="bar-label">${escapeHtml(name)}</div>
        <div class="bar-track"><div class="bar-fill benchmark" style="width:${Math.min(Math.abs(ret) / 2, 1) * 100}%"></div></div>
        <div class="bar-value pct ${pctClass(ret)}">${fmtPct(ret)}</div>
      </div>
    `).join("");
    const modeSection = (label, bt) => bt ? `
      <div class="screener-group">
        <div class="bar-row">
          <div class="bar-label">${escapeHtml(label)}</div>
          <div class="bar-track"><div class="bar-fill strategy" style="width:${Math.min(Math.abs(bt.blended_return) / 2, 1) * 100}%"></div></div>
          <div class="bar-value pct ${pctClass(bt.blended_return)}">${fmtPct(bt.blended_return)}</div>
        </div>
        <div style="padding-top:6px; font-family:var(--mono); font-size:12px; color:var(--text-dim);">
          ${bt.total_entries} entries · ${bt.total_tp1} TP1 · ${bt.total_tp2} TP2 · ${bt.total_stops} stops ·
          win rate ${fmtPct(bt.win_rate, 1)} · avg win ${fmtPct(bt.avg_win)} · avg loss ${fmtPct(bt.avg_loss)}
          ${bt.avg_max_drawdown != null ? ` · avg max drawdown ${fmtPct(bt.avg_max_drawdown, 1)} (worst ${fmtPct(bt.worst_max_drawdown, 1)})` : ""}
          ${bt.max_concurrent_positions != null ? ` · concurrent positions: max ${bt.max_concurrent_positions}, min ${bt.min_concurrent_positions}` : ""}
        </div>
      </div>
    ` : "";
    backtestTarget.innerHTML = `
      <div class="table-scroll" style="padding:14px 16px;">
        ${modeSection("Strategy (limited capital, $10k/symbol)", btData.limited)}
        ${modeSection("Strategy (unlimited capital, fixed $ per entry)", btData.unlimited)}
        <div class="screener-group">
          <div class="bar-label" style="padding-bottom:4px;">Benchmarks</div>
          ${benchBars}
        </div>
      </div>
    `;
  }

  // --- Point-in-time trend (2026-07-17, user request) --- built from ACTUAL
  // accumulated screener_hits (backtest.point_in_time_backtest), not today's
  // universe replayed across 3 years like the section above -- see that module's
  // own survivorship-bias docstring. Absent until that script has run once;
  // shown as an honest "still accumulating" note rather than a confident number
  // until is_meaningful flips true (see MIN_COVERAGE_DAYS_FOR_MEANINGFUL_RESULT).
  const pitTarget = document.getElementById("point-in-time-target");
  const pit = data.point_in_time_backtest;
  if (!pit) {
    document.getElementById("point-in-time-section").style.display = "none";
  } else {
    const coverageYears = (pit.max_coverage_days / 365).toFixed(1);
    if (!pit.is_meaningful) {
      pitTarget.innerHTML = `
        <div class="empty-state">
          Still accumulating -- longest tracked symbol has ${pit.max_coverage_days} day(s) of real
          screener history (need ~${pit.min_coverage_days_for_meaningful_result} for a ~1-year
          point-in-time result). ${pit.symbols_covered} symbol(s) tracked so far. Re-check after
          the pipeline has run nightly for longer.
        </div>
      `;
    } else {
      pitTarget.innerHTML = `
        <div class="table-scroll" style="padding:14px 16px;">
          <div class="screener-group">
            <div class="bar-row">
              <div class="bar-label">Blended return (own window)</div>
              <div class="bar-track"><div class="bar-fill strategy" style="width:${Math.min(Math.abs(pit.blended_return) / 2, 1) * 100}%"></div></div>
              <div class="bar-value pct ${pctClass(pit.blended_return)}">${fmtPct(pit.blended_return)}</div>
            </div>
            <div style="padding-top:6px; font-family:var(--mono); font-size:12px; color:var(--text-dim);">
              ${pit.symbols_covered} symbols · ${pit.total_entries} entries · longest coverage
              ${pit.max_coverage_days}d (~${coverageYears}y) · each symbol backtested only over the
              window it was ACTUALLY screener-visible, not today's universe over 3 years
            </div>
          </div>
        </div>
      `;
    }
  }

  // --- Recent alerts --- SCREENER GROUP HEADERS (2026-08-26, user request:
  // "หมายถึงให้ทำ format เดียวกับที่ให้แก้ไปด้านบน" -- the SAME bold .screener-row
  // divider the Holding/Waiting position table uses, not a smaller per-row chip)
  // -- inserted whenever a.screener_group changes walking these rows in their
  // EXISTING (most-recent-first) order, same "insert on change" mechanism the
  // position table's screener-row insertion uses, just for this div-based list
  // instead of a <table>.
  const alertsTarget = document.getElementById("alerts-target");
  if (!data.recent_alerts.length) {
    alertsTarget.innerHTML = `<div class="empty-state">No alerts logged yet.</div>`;
  } else {
    let lastAlertGroup = null, alertAltIdx = 0;
    const rows = data.recent_alerts.map(a => {
      let header = "";
      if (a.screener_group !== lastAlertGroup) {
        lastAlertGroup = a.screener_group;
        header = `<div class="alert-screener-row">${escapeHtml(a.screener_group)}</div>`;
      }
      const altClass = (alertAltIdx++ % 2 === 1) ? " alt" : "";
      return `${header}
      <div class="alert-row${altClass}">
        <div class="ts">${escapeHtml(a.ts)}</div>
        <div class="symbol">${escapeHtml(a.symbol)}</div>
        <div class="kind">${escapeHtml(a.kind)}</div>
        <div class="msg">${escapeHtml(a.message)}</div>
      </div>
    `;
    }).join("");
    alertsTarget.innerHTML = `<div class="table-scroll" style="padding:4px 16px;">${rows}</div>`;
  }

  // --- New Signals Today (2026-07-18, user request) --- mirrors pipeline.py's
  // EVENT_LABELS (db/database.py) so the wording matches the Discord digest.
  const EVENT_LABELS = {
    ENTRY: ["🟢", "Entry"],
    WAITING_CORRECTION_START: ["⏳", "New Pattern (Waiting)"],
    WAITING_CORRECTION_RECONFIRMED: ["🔁", "Pattern Reconfirmed (Waiting)"],
    WAITING_CORRECTION_INVALIDATED: ["❌", "Pattern Invalidated"],
    ENTRY_BLOCKED_UNTRADEABLE: ["🚫", "Entry Blocked (Untradeable)"],
    CLOSED_POSITION_CAP: ["✂️", "Closed (Position Cap)"],
    TIER_ASSIGNED: ["🏷️", "Tier Assigned"],
    TRAILING_STOP_RAISED: ["📈", "Stop Raised"],
    TP1: ["💰", "TP1 Hit"],
    TP2_CLOSE: ["🎯", "TP2 Close"],
    STOP: ["🛑", "Stopped Out"],
  };
  const todaySignalsTarget = document.getElementById("today-signals-target");
  if (!data.todays_signals.length) {
    todaySignalsTarget.innerHTML = `<div class="empty-state">No new events today.</div>`;
  } else {
    // Same screener-group-header insertion as Recent Alerts above (2026-08-26).
    let lastSignalGroup = null, signalAltIdx = 0;
    const todayRows = data.todays_signals.map(s => {
      const [emoji, label] = EVENT_LABELS[s.kind] || ["•", s.kind];
      let header = "";
      if (s.screener_group !== lastSignalGroup) {
        lastSignalGroup = s.screener_group;
        header = `<div class="alert-screener-row">${escapeHtml(s.screener_group)}</div>`;
      }
      const altClass = (signalAltIdx++ % 2 === 1) ? " alt" : "";
      return `${header}
      <div class="alert-row${altClass}">
        <div class="ts">${escapeHtml(s.ts)}</div>
        <div class="symbol">${escapeHtml(s.symbol)}</div>
        <div class="kind">${emoji} ${escapeHtml(label)}</div>
        <div class="msg">${escapeHtml(s.message)}</div>
      </div>
    `;
    }).join("");
    todaySignalsTarget.innerHTML = `<div class="table-scroll" style="padding:4px 16px;">${todayRows}</div>`;
  }
</script>
</body>
</html>
